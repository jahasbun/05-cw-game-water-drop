<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Drop Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-wrapper">
        <header class="game-header">
            <img class="brand-logo" src="img/cw_logo-horizontal.png" alt="charity: water logo" />
        </header>

        <h1 class="game-title">Water Drop</h1>
        <p class="game-tagline">Catch the good drops, avoid the bad ones!</p>

        <div class="score-panel">
            <div class="score">Score: <span id="score">0</span></div>
            <div class="timer">Time: <span id="time">30</span>s</div>
            <div class="lives">
                <span class="lives-label">Lives:</span>
                <span id="hearts" aria-hidden="true">
                    <span class="heart">♥</span>
                    <span class="heart">♥</span>
                    <span class="heart">♥</span>
                </span>
                <span id="lives-text" class="visually-hidden" aria-live="polite">3 of 3 lives remaining</span>
            </div>
            <button id="start-btn" type="button">Start Game</button>
        </div>

        <div id="game-message" class="game-message hidden" aria-live="polite"></div>

        <div id="game-container" aria-label="Water drop game area">
            <div id="bucket" class="bucket" aria-hidden="true"></div>
        </div>
    </div>

    <div id="confetti-container" aria-hidden="true"></div>
    <script src="script.js"></script>
</body>
</html>
